<!DOCTYPE html>
<html>
<head>
  <title>HDMI Monitor</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #controls { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(20, 20, 20, 0.9); padding: 10px 14px; border-radius: 8px; border: 1px solid #444; }
    select, button { margin-right: 6px; padding: 6px 10px; border-radius: 4px; border: none; font-size: 14px; cursor: pointer; }
    button { background: #1a73e8; color: #fff; font-weight: bold; }
    button:hover { background: #1557b0; }
    #status { margin-top: 8px; font-size: 13px; color: #ffab40; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="startBtn">1. Start / Load Devices</button>
    <select id="videoSource"><option value="">Select Video...</option></select>
    <select id="audioSource"><option value="">Select Audio...</option></select>
    <button id="fullscreenBtn">Fullscreen</button>
    <button id="hideBtn">Hide Menu</button>
    <div id="status">Click "1. Start / Load Devices" to begin.</div>
  </div>
  <video id="video" autoplay playsinline></video>

  <script>
    const video = document.getElementById('video');
    const videoSelect = document.getElementById('videoSource');
    const audioSelect = document.getElementById('audioSource');
    const controls = document.getElementById('controls');
    const statusText = document.getElementById('status');

    async function loadDevices() {
      statusText.textContent = "Requesting camera/mic permission...";
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        tempStream.getTracks().forEach(track => track.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        videoSelect.innerHTML = '';
        audioSelect.innerHTML = '';

        devices.forEach(device => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `${device.kind}`;
          if (device.kind === 'videoinput') videoSelect.appendChild(option);
          if (device.kind === 'audioinput') audioSelect.appendChild(option);
        });

        statusText.textContent = "Devices loaded. Starting stream...";
        await startStream();
      } catch (err) {
        statusText.textContent = "Error: " + err.name + " - " + err.message;
      }
    }

    async function startStream() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      try {
        const constraints = {
          video: videoSelect.value ? { deviceId: { exact: videoSelect.value }, width: { ideal: 1920 }, height: { ideal: 1080 } } : true,
          audio: audioSelect.value ? { deviceId: { exact: audioSelect.value }, echoCancellation: false, noiseSuppression: false, autoGainControl: false } : false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        statusText.textContent = "Playing! Double-click screen to hide/show menu.";
      } catch (err) {
        statusText.textContent = "Stream Error: " + err.name + " - " + err.message;
      }
    }

    document.getElementById('startBtn').onclick = loadDevices;
    videoSelect.onchange = startStream;
    audioSelect.onchange = startStream;

    document.getElementById('fullscreenBtn').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          statusText.textContent = "Fullscreen blocked by Chrome. Use the Fullscreen key on your keyboard instead.";
        });
      } else {
        document.exitFullscreen();
      }
    };

    document.getElementById('hideBtn').onclick = () => controls.style.display = 'none';
    document.body.ondblclick = () => controls.style.display = controls.style.display === 'none' ? 'block' : 'none';
  </script>
</body>
</html>
