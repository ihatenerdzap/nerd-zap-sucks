<!DOCTYPE html>
<html>
<head>
  <title>HDMI Monitor Pro</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #fff;
      user-select: none;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      display: block;
      position: relative;
      z-index: 1;
    }

    #dvdLogo {
      position: fixed;
      top: 100px;
      left: 100px;
      z-index: 5;
      pointer-events: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2px;
      color: #ff2a85;
      border: 3px solid #ff2a85;
      border-radius: 50%;
      padding: 14px 28px;
      text-align: center;
      line-height: 1.1;
      background: #000;
    }

    #dvdSub {
      display: block;
      font-size: 11px;
      letter-spacing: 4px;
      margin-top: 4px;
    }

    #controls {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      max-width: 1060px;
      z-index: 10;
      background: #1f0a17;
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid #ff2a85;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ff2a85;
    }

    .pink-banner {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 2px;
      color: #ff2a85;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    select, button {
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #331126;
      color: #fff;
      border: 1px solid #ff2a85;
      transition: background 0.15s ease;
    }

    select:hover, button:hover {
      background: #4d1939;
    }

    button.primary {
      background: #ff2a85;
      border: 1px solid #ff2a85;
      color: #fff;
    }

    button.primary:hover {
      background: #e01e72;
    }

    button.muted {
      background: #b80d3a;
      border-color: #ff5c8a;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #331126;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid #ff2a85;
      font-size: 13px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 90px;
      accent-color: #ff2a85;
      cursor: pointer;
    }

    #status {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: #ff85b8;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div id="dvdLogo">
    NERDZAP SUCKS!
    <span id="dvdSub">VIDEO</span>
  </div>

  <div id="controls">
    <div class="header-bar">
      <div class="pink-banner">NERDZAP SUCKS!</div>
      <div id="status">READY TO CONNECT</div>
    </div>
    <div class="row">
      <button id="startBtn" class="primary">1. Start / Load Devices</button>
      <select id="videoSource" title="Video Capture Device"><option value="">Select Video...</option></select>
      <select id="audioSource" title="Audio Capture Device"><option value="">Select Audio...</option></select>
      <select id="resSelect" title="Resolution">
        <option value="1080" selected>1080p (Full HD)</option>
        <option value="720">720p (Low Lag)</option>
        <option value="auto">Auto Resolution</option>
      </select>
      <select id="fpsSelect" title="Frame Rate">
        <option value="60" selected>60 FPS</option>
        <option value="30">30 FPS</option>
      </select>
    </div>
    <div class="row">
      <button id="muteBtn">🔊 Unmuted</button>
      <div class="slider-group">
        <span>Vol:</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
        <span id="volLabel">100%</span>
      </div>
      <button id="fitBtn">Screen: Fit (Bars)</button>
      <button id="dvdBtn">DVD Bounce (D)</button>
      <button id="fullscreenBtn">Fullscreen (F)</button>
      <button id="hideBtn">Hide Menu (H)</button>
    </div>
  </div>
  <video id="video" autoplay playsinline></video>

  <script>
    const video = document.getElementById('video');
    const videoSelect = document.getElementById('videoSource');
    const audioSelect = document.getElementById('audioSource');
    const resSelect = document.getElementById('resSelect');
    const fpsSelect = document.getElementById('fpsSelect');
    const muteBtn = document.getElementById('muteBtn');
    const volSlider = document.getElementById('volSlider');
    const volLabel = document.getElementById('volLabel');
    const controls = document.getElementById('controls');
    const statusText = document.getElementById('status');
    const fitBtn = document.getElementById('fitBtn');
    const dvdLogo = document.getElementById('dvdLogo');

    // DVD Bouncer Logic
    let dvdX = 120;
    let dvdY = 180;
    let dvdVx = 2.5;
    let dvdVy = 2.5;
    const dvdColors = ['#ff2a85', '#00f5d4', '#ffbe0b', '#9d4edd', '#3a86ff', '#ff5400', '#06d6a0'];
    let colorIndex = 0;

    function changeDvdColor() {
      colorIndex = (colorIndex + 1) % dvdColors.length;
      const newColor = dvdColors[colorIndex];
      dvdLogo.style.color = newColor;
      dvdLogo.style.borderColor = newColor;
    }

    function animateDvd() {
      if (dvdLogo.style.display !== 'none') {
        const maxX = window.innerWidth - dvdLogo.offsetWidth;
        const maxY = window.innerHeight - dvdLogo.offsetHeight;

        dvdX += dvdVx;
        dvdY += dvdVy;

        let hitEdge = false;
        if (dvdX <= 0) { dvdX = 0; dvdVx = Math.abs(dvdVx); hitEdge = true; }
        if (dvdX >= maxX) { dvdX = maxX; dvdVx = -Math.abs(dvdVx); hitEdge = true; }
        if (dvdY <= 0) { dvdY = 0; dvdVy = Math.abs(dvdVy); hitEdge = true; }
        if (dvdY >= maxY) { dvdY = maxY; dvdVy = -Math.abs(dvdVy); hitEdge = true; }

        if (hitEdge) changeDvdColor();

        dvdLogo.style.left = dvdX + 'px';
        dvdLogo.style.top = dvdY + 'px';
      }
      requestAnimationFrame(animateDvd);
    }
    requestAnimationFrame(animateDvd);

    function toggleDvd() {
      dvdLogo.style.display = dvdLogo.style.display === 'none' ? 'block' : 'none';
    }

    const fitModes = [
      { mode: 'contain', label: 'Screen: Fit (Bars)' },
      { mode: 'cover', label: 'Screen: Zoom Crop' },
      { mode: 'fill', label: 'Screen: Stretch Full' }
    ];
    let currentFit = 0;

    function cycleFit() {
      currentFit = (currentFit + 1) % fitModes.length;
      video.style.objectFit = fitModes[currentFit].mode;
      fitBtn.textContent = fitModes[currentFit].label;
    }

    function toggleMute() {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? '🔇 Muted' : '🔊 Unmuted';
      muteBtn.classList.toggle('muted', video.muted);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function toggleMenu() {
      controls.style.display = controls.style.display === 'none' ? 'block' : 'none';
    }

    fitBtn.onclick = cycleFit;
    muteBtn.onclick = toggleMute;
    document.getElementById('dvdBtn').onclick = toggleDvd;
    document.getElementById('fullscreenBtn').onclick = toggleFullscreen;
    document.getElementById('hideBtn').onclick = toggleMenu;

    volSlider.oninput = () => {
      video.volume = volSlider.value;
      volLabel.textContent = Math.round(volSlider.value * 100) + '%';
      if (video.volume > 0 && video.muted) toggleMute();
    };

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT') return;
      const key = e.key.toLowerCase();
      if (key === 'f') toggleFullscreen();
      if (key === 'h') toggleMenu();
      if (key === 'm') toggleMute();
      if (key === 's') cycleFit();
      if (key === 'd') toggleDvd();
    });

    async function loadDevices() {
      statusText.textContent = "REQUESTING PERMISSIONS...";
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        tempStream.getTracks().forEach(track => track.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const savedVideo = videoSelect.value;
        const savedAudio = audioSelect.value;

        videoSelect.innerHTML = '';
        audioSelect.innerHTML = '';

        devices.forEach(device => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `${device.kind}`;
          if (device.kind === 'videoinput') videoSelect.appendChild(option);
          if (device.kind === 'audioinput') audioSelect.appendChild(option);
        });

        if (savedVideo) videoSelect.value = savedVideo;
        if (savedAudio) audioSelect.value = savedAudio;

        await startStream();
      } catch (err) {
        statusText.textContent = "ERROR: " + err.message.toUpperCase();
      }
    }

    async function startStream() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      
      const res = resSelect.value;
      const fps = parseInt(fpsSelect.value, 10);
      let videoConstraints = { frameRate: { ideal: fps } };
